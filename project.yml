name: Loyfus
options:
  bundleIdPrefix: br.com.loyfus
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

schemes:
  Loyfus:
    build:
      targets:
        Loyfus: all
        LoyfusTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LoyfusTests

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  Loyfus:
    type: application
    platform: iOS
    sources:
      - path: Loyfus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.loyfus
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Loyfus/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_STRICT_CONCURRENCY: minimal
    info:
      path: Loyfus/Info.plist
      properties:
        CFBundleDisplayName: Loyfus
        CFBundleURLTypes:
          - CFBundleURLName: br.com.loyfus
            CFBundleURLSchemes:
              - loyfus
        # Paper in light, the near-black ground in dark: the launch frame matches the first
        # frame the app draws, so nothing flashes white at a dark-mode user.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # WCAG 3.1.1: the page language is declared, so screen readers read pt-BR
        # and any future translation gets its own locale rather than being guessed.
        CFBundleDevelopmentRegion: pt_BR
        CFBundleLocalizations:
          - pt_BR
        UIAppFonts:
          - Bricolage-Regular.ttf
          - Bricolage-Medium.ttf
          - Bricolage-SemiBold.ttf
          - Bricolage-Bold.ttf
          - InterTight-Regular.ttf
          - InterTight-Medium.ttf
          - InterTight-SemiBold.ttf
          - InterTight-Bold.ttf
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # On a physical device the catalogue is served from a machine on the local
        # network (AppConfig.apiBaseURL); iOS asks the reader once, with this text.
        NSLocalNetworkUsageDescription: O Loyfus busca o catálogo de leilões em um servidor na sua rede local.

  LoyfusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LoyfusTests
    dependencies:
      - target: Loyfus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.loyfus.tests
        GENERATE_INFOPLIST_FILE: "YES"
