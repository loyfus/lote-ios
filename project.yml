name: Lote
options:
  bundleIdPrefix: br.com.lote
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

schemes:
  Lote:
    build:
      targets:
        Lote: all
        LoteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LoteTests

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  Lote:
    type: application
    platform: iOS
    sources:
      - path: Lote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.lote
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Lote/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_STRICT_CONCURRENCY: minimal
    info:
      path: Lote/Info.plist
      properties:
        CFBundleDisplayName: Lote
        CFBundleURLTypes:
          - CFBundleURLName: br.com.lote
            CFBundleURLSchemes:
              - lote
        # Paper in light, the near-black ground in dark: the launch frame matches the first
        # frame the app draws, so nothing flashes white at a dark-mode user.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # WCAG 3.1.1: the page language is declared, so screen readers read pt-BR
        # and any future translation gets its own locale rather than being guessed.
        CFBundleDevelopmentRegion: pt_BR
        CFBundleLocalizations:
          - pt_BR
        UIAppFonts:
          - Bricolage-Regular.ttf
          - Bricolage-Medium.ttf
          - Bricolage-SemiBold.ttf
          - Bricolage-Bold.ttf
          - InterTight-Regular.ttf
          - InterTight-Medium.ttf
          - InterTight-SemiBold.ttf
          - InterTight-Bold.ttf
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # The catalogue is served over HTTPS through a Cloudflare Tunnel, so the
        # app does not touch the LAN. These two keys stay for the documented local
        # development path (AppConfig.apiBaseURL pointed at a machine on the LAN):
        # without the description iOS would show an empty prompt in that case.
        NSLocalNetworkUsageDescription: O Lote busca o catálogo de leilões em um servidor na sua rede local durante o desenvolvimento.

  LoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LoteTests
    dependencies:
      - target: Lote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.lote.tests
        GENERATE_INFOPLIST_FILE: "YES"
